# Jinie EduTech logo on InMoov i2 HandCoverV1  -- all dimensions in mm
# Paths are relative to cad/04_jinie_branding/. From the repo root:
#   python cad/04_jinie_branding/src/apply_logo.py [this file]
#
# Part frame (as in the official STL): outer (visible) face = +Y, wrist end = Z0, finger end = Z107.
# The old "InMoov" engraving sits in the strip X 41..54, Z 21..85 and reads wrist -> fingers.
# Text regeneration needs Noto Sans CJK Bold (or Noto Sans Bold) at the font: path below.

source_stl: ../01_official_inmoov_i2/print/i2_HandCoverV1.stl
icon_png:   assets/company_logo_solo.png        # blue polyhedron icon (traced automatically)
font:       /usr/share/fonts/opentype/noto/NotoSansCJK-Bold.ttc
output_dir: stl
dxf_dir:    dxf
report_dir: reports
write_work: false

old_logo:                     # region that is searched for the old engraving and filled flush
  box_x: [39.5, 56.0]
  box_z: [19.0, 87.0]
  detect_threshold: 0.8       # a pixel deeper than this below the fitted surface = old engraving
  fill_eps: 0.01              # filler top sits this far under the reconstructed surface (avoids coplanar slivers)
  mask_grow: 0.2             # grow detected engraving mask before rebuilding the surface over it
output_name: JE_HandCoverV1_NoLogo

logo:
  variant: none          # icon_text | icon_only | text_only | none
  text: "Jinie EduTech"
  style: engrave              # engrave (same as original InMoov text) | emboss
  depth: 1.0                  # engrave depth / emboss height, measured along -Y from the local surface
  total_length: 60.0          # length along the strip (reading direction); text is auto-sized to fit
  icon_height: 12.0           # icon height (across the strip); strip is ~13 mm wide
  gap: 2.5                    # icon <-> text gap
  center_x: 47.5              # logo centre (strip centre line)
  center_z: 53.0
  reading_dir: +Z             # +Z: reads wrist -> fingers like the original;  -Z: fingers -> wrist
  text_bold: 0.05             # grow text outline by this (mm per side) so thin strokes stay >= ~0.6 mm
  min_rib: 0.8                # widen the white gaps inside the icon to at least this (FDM printable)

grid_res: 0.2                 # height-map resolution used for surface following
