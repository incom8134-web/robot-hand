# HAEBOT Hand i2 V1 - single source of truth for CAD dimensions (mm)
# Tags: [SRC] cited source / measured from official STL, [DS] seller/datasheet nominal,
#       [EST] engineering estimate, [TBM] to be measured with calipers on the real part.
# After measuring, put the value in `measured:` and re-run cad/src/build_all.py.

clearance: 0.20            # [EST] per side, FDM. Tune with the fit coupon (T-01)

es08ma_ii:                 # EMAX ES08MA II micro servo
  body_length:   {nominal: 23.0, tag: DS,  measured: null}   # littlebirdelectronics listing
  body_width:    {nominal: 11.5, tag: DS,  measured: null}
  case_height:   {nominal: 24.0, tag: DS,  measured: null}   # bottom to case top
  tab_span:      {nominal: 32.5, tag: EST, measured: null}   # tip to tip of mounting tabs
  tab_thickness: {nominal: 1.8,  tag: EST, measured: null}
  tab_bottom_z:  {nominal: 15.5, tag: EST, measured: null}   # case bottom -> underside of tabs
  tab_hole_pitch: {nominal: 27.5, tag: EST, measured: null}
  tab_hole_dia:  {nominal: 2.0,  tag: EST, measured: null}
  shaft_from_end: {nominal: 5.75, tag: EST, measured: null}   # shaft centre -> nearest body end
  shaft_above_case: {nominal: 4.0, tag: EST, measured: null}
  spline_dia:    {nominal: 4.0,  tag: EST, measured: null}

stock_horn:                # single-arm horn shipped with the servo - pulley keys onto it
  arm_length:    {nominal: 16.0, tag: TBM, measured: null}   # shaft centre -> arm tip
  hub_dia:       {nominal: 7.0,  tag: TBM, measured: null}
  hub_height:    {nominal: 4.0,  tag: TBM, measured: null}
  arm_width_hub: {nominal: 6.0,  tag: TBM, measured: null}
  arm_width_tip: {nominal: 3.8,  tag: TBM, measured: null}
  arm_thickness: {nominal: 1.8,  tag: TBM, measured: null}
  screw_dia:     {nominal: 2.2,  tag: TBM, measured: null}

inmoov_i2:                 # measured from official STL files (inmoov.fr, downloaded 2026-11-11)
  pulley: {dia: 17.0, height: 10.0, tag: SRC}
  finger_root_knuckle: {width: 7.0, hinge_hole_dia: 3.58, tag: SRC}
  finger_proximal_body_width: {value: 11.5, tag: SRC}
  ptfe_tube_od: {value: 2.5, tag: SRC}                       # InMoov BOM
  tendon_line_dia: {value: 0.8, tag: SRC}                    # InMoov BOM

servo_seat:                # generic ES08MA II seat used by the fit coupon and the one-finger rig
  block_height: 20.0       # [EST] seat block thickness
  ledge_z: 15.5            # [EST] = tab_bottom_z, so the case bottom is flush with the block bottom

inmoov_forearm_servo_bed:  # RobServoBedV6.stl (inmoov.fr Forearm-and-Servo-Bed), measured from the STL
  seats: 5                 # 3 front bay + 2 rear bay, servo upright, shaft +Z
  hole_pitch_along: 49.8   # [SRC] tab-hole spacing along the servo (front bay 49.7-50.0, rear 49.4)
  hole_pitch_across: 9.5   # [SRC] two holes per tab
  hole_dia: 3.07           # [SRC]
  rail_top_z: 29.5         # [SRC] 4 seats; rear-right seat 26.1 (original stagger, kept)
  bay_floor_top_z: 3.5     # [SRC]
  std_body_length: 40.7    # [EST] standard servo the bed was built for (MG946R / HK15298 class)
  std_shaft_from_end: 10.2 # [EST] standard-servo shaft centre -> nearest body end
  std_shaft_top_above_rail: 16.5   # [EST] ~2.5 tab + ~9 case + ~5 shaft
adapter_plate:
  thickness: 4.0           # [EST] = std_shaft_top_above_rail (16.5) - ES08MA shaft top above tabs (8.5 + 4.0)
  width: 18.0
  end_margin: 1.6          # hole centre -> plate end; clears the bed centre post (0.4 mm), slots are open U-slots
